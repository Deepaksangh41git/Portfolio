name: Ingest portfolio knowledge

on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "**.pdf"
      - "**.md"
      - "rag/ingest/**"
      - ".github/workflows/ingest.yml"

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rag/ingest/requirements.txt
      - run: pip install -r rag/ingest/requirements.txt
      - name: Chunk, embed and sync
        run: python rag/ingest/ingest.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ vars.GITHUB_USER || github.repository_owner }}
          PORTFOLIO_REPO: ${{ vars.PORTFOLIO_REPO || github.event.repository.name }}
          SKIP_REPOS: ${{ vars.SKIP_REPOS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
